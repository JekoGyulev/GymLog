<!DOCTYPE html>
<html lang="en" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>GymBeast - Login</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="bg-image" aria-hidden="true"></div>
<div class="ambient" aria-hidden="true"></div>

<header>
    <nav>
        <a th:href="@{/}" class="logo">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
            </svg>
            GymBeast
        </a>
        <a sec:authorize="isAuthenticated()" th:href="@{/home}" class="nav-link">Back to home</a>
    </nav>
</header>

<main>
    <section class="login-card" aria-labelledby="login-heading">
        <div class="card-content">

            <p th:if="${successfulRegistrationMessage}" th:text="${successfulRegistrationMessage}"
               class="successful-message"></p>

            <h1 id="login-heading">Log in to <span class="gradient-text">GymBeast</span></h1>
            <p class="subtitle">Your next PR is one login away.</p>

            <form th:action="@{/login}" th:method="POST" th:object="${loginRequest}" id="login-form" >

                <p class="alert-warning" style="margin-bottom: 10px;" th:if="${loginErrorMessage}" th:text="${loginErrorMessage}"></p>

                <p id="fill-in-fields-message" style="margin-bottom: 10px;"></p>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <input th:field="*{username}" type="text" id="username" name="username" placeholder="Alex123" autocomplete="name"/>
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </div>

                    <p class="alert-warning" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input th:field="*{password}" type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password"/>
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                    </div>

                    <p class="alert-warning" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                </div>



                <div class="options">
                    <label class="remember">
                        <input type="checkbox" name="remember"/>
                        Remember me
                    </label>
                    <a th:href="@{/forgot-password}" class="forgot">Forgot password?</a>
                </div>



                <button type="submit" class="btn btn-primary">
                    Log in
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 12h14M12 5l7 7-7 7"></path>
                    </svg>
                </button>
            </form>

            <div class="divider">or continue with</div>

            <a href="#" class="social-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </a>

            <p class="signup-prompt">Don't have an account? <a th:href="@{/register}">Create an account</a></p>

            <div class="motivation">
                <blockquote>
                    “The only bad workout is the one that <span>didn't happen</span>.”
                </blockquote>
                <cite>— The GymBeast Team</cite>
            </div>
        </div>
    </section>
</main>

<footer th:insert="fragments/footer :: footer"></footer>


<script>

    let loginForm = document.getElementById('login-form');
    let username = document.getElementById('username');
    let password = document.getElementById('password');
    let fillInFieldsMessage = document.getElementById('fill-in-fields-message');


    loginForm.addEventListener('submit', (e) => {

       if (username.value === '' || password.value === '') {
           e.preventDefault();

           fillInFieldsMessage.textContent = 'Please enter all required information'
           fillInFieldsMessage.style.display = 'block';
           fillInFieldsMessage.classList.add('alert-warning');

       } else {
           fillInFieldsMessage.style.display = 'none';
       }

    });



</script>

</body>
</html>
